<div id="continuum-c1">
  <style>
    #continuum-c1{color:var(--foreground);font-family:inherit}
    #continuum-c1 .c1-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 100px 12px 0}
    #continuum-c1 .c1-toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px}
    #continuum-c1 .c1-field{display:flex;flex-direction:column;gap:5px;min-width:145px;flex:1}
    #continuum-c1 .c1-scene{position:relative;width:100%;height:560px;overflow:hidden;touch-action:none}
    #continuum-c1 canvas{display:block;width:100%;height:100%;touch-action:none}
    #continuum-c1 .c1-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    #continuum-c1 .c1-tag{position:absolute;transform:translate(-50%,-50%);padding:4px 7px;background:var(--background);color:var(--foreground);white-space:nowrap;opacity:.94}
    #continuum-c1 .c1-caption{position:absolute;left:0;bottom:10px;right:0;display:flex;flex-wrap:wrap;gap:5px 20px;pointer-events:none}
    #continuum-c1 .c1-detail{min-height:55px;display:flex;flex-direction:column;gap:6px;padding:10px 0}
    #continuum-c1 .c1-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    #continuum-c1 .c1-flow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:8px 0}
    #continuum-c1 .c1-key{display:inline-block;width:9px;height:9px;background:var(--viz-series-1);margin-right:5px}
    #continuum-c1 .c1-key.hyp{background:none;border:1px dashed var(--viz-series-2)}
    #continuum-c1 .c1-note{color:var(--muted-foreground);padding:5px 0}
    #continuum-c1 [hidden]{display:none!important}
    @media(max-width:520px){#continuum-c1 .c1-scene{height:430px}#continuum-c1 .c1-field{min-width:125px}#continuum-c1 .c1-head{padding-right:90px}}
  </style>
  <div class="c1-head"><strong>续存 C1 · CONTINUUM</strong><span class="text-small text-muted">三维工业概念 / v0.1 / mm</span></div>
  <div class="c1-toolbar">
    <label class="c1-field form-label">观察方式<select id="c1-view" class="form-select"><option value="assembly">整体装配</option><option value="exploded">模块分解</option><option value="xray">外壳透视</option><option value="wear">佩戴关系</option><option value="flow">作用机理</option></select></label>
    <label class="c1-field form-label">查看部件<select id="c1-part" class="form-select"><option value="all">整个装置</option></select></label>
    <label id="c1-exp-field" class="c1-field form-label" hidden>分解量 <span id="c1-exp-val" class="tabular-nums">70%</span><input id="c1-explode" class="form-range" type="range" min="0" max="100" value="70"></label>
    <label id="c1-step-field" class="c1-field form-label" hidden>数据链路<select id="c1-step" class="form-select"><option value="0">1 · 头皮电位采集</option><option value="1">2 · 放大与模数转换</option><option value="2">3 · 时间标记与无线发送</option><option value="3">4 · 加密与本地存储</option><option value="4">5 · 数据同步至云端</option><option value="5">? · 意识状态重建（未实现）</option></select></label>
  </div>
  <div class="c1-scene" id="c1-scene" role="img" aria-label="可旋转的头戴采集装置与桌面存储底座三维模型；支持装配、分解、透视、佩戴和数据流示意。">
    <div class="c1-labels" id="c1-labels"></div>
    <div class="c1-caption text-small text-muted"><span>拖动旋转 · 滚轮缩放 · 点击部件</span><span id="c1-size">头环包络约 240 × 287 × 103 mm</span></div>
  </div>
  <div id="c1-detail" class="c1-detail" aria-live="polite"><span id="c1-detail-title">开放式头环 + 私有存储底座</span><span id="c1-detail-text" class="text-small text-muted">8 路采集电极 · 2 个参考／偏置接触件 · 可拆电池 · 无线数据链路</span></div>
  <div class="c1-flow text-small"><span><i class="c1-key"></i>可由现有技术实现的数据链路</span><span><i class="c1-key hyp"></i>未实现的意识重建接口</span></div>
  <div class="c1-note text-small">结构与器件均为概念布局；不具备意识转移能力，不能直接作为人体使用或量产图纸。</div>
</div>
<!-- C1_LIBRARIES -->
<script>
/* C1_MODEL */
(function(){
  const host=document.getElementById('continuum-c1'),stage=host.querySelector('#c1-scene');
  const viewEl=host.querySelector('#c1-view'),partEl=host.querySelector('#c1-part'),stepEl=host.querySelector('#c1-step'),expEl=host.querySelector('#c1-explode');
  const detailTitle=host.querySelector('#c1-detail-title'),detailText=host.querySelector('#c1-detail-text'),labelsEl=host.querySelector('#c1-labels');
  if(!window.THREE){detailTitle.textContent='三维引擎未加载';detailText.textContent='请打开随模型包提供的离线预览。';return;}
  const T=window.THREE,scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;stage.prepend(renderer.domElement);
  const camera=new T.PerspectiveCamera(35,1,1,5000);camera.position.set(370,310,455);
  const controls=new T.OrbitControls(camera,renderer.domElement);controls.target.set(0,111,0);controls.enableDamping=true;controls.dampingFactor=.1;controls.minDistance=230;controls.maxDistance=1400;controls.maxPolarAngle=Math.PI*.93;controls.enablePan=true;
  scene.add(new T.HemisphereLight(0xe5f5ff,0x4b4b4b,.9));scene.add(new T.AmbientLight(0xffffff,.35));
  const key=new T.DirectionalLight(0xffffff,1.6);key.position.set(150,450,260);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-350;key.shadow.camera.right=350;key.shadow.camera.top=350;key.shadow.camera.bottom=-350;key.shadow.camera.near=1;key.shadow.camera.far=1200;key.shadow.bias=-.0003;scene.add(key);
  const rim=new T.DirectionalLight(0xadc9ed,1.2);rim.position.set(-300,160,-260);scene.add(rim);
  const model=createContinuumC1(T);scene.add(model.root);
  const floor=new T.Mesh(new T.PlaneGeometry(1100,1100),new T.ShadowMaterial({opacity:.13}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.1;floor.receiveShadow=true;scene.add(floor);
  let grid=new T.GridHelper(600,24,0x888888,0xcccccc);grid.position.y=-1;grid.material.transparent=true;grid.material.opacity=.18;scene.add(grid);
  const head=new T.Group();head.name='WEAR_REFERENCE_NOT_PRODUCT';let skin=new T.MeshStandardMaterial({color:0xc2c6c6,roughness:1,transparent:true,opacity:.25,depthWrite:false});
  let skull=new T.Mesh(new T.SphereGeometry(1,48,32),skin);skull.scale.set(88,101,101);skull.position.set(0,110,0);head.add(skull);
  let face=new T.Mesh(new T.SphereGeometry(1,32,24),skin);face.scale.set(63,70,42);face.position.set(0,80,49);head.add(face);
  let nose=new T.Mesh(new T.SphereGeometry(1,20,12),skin);nose.scale.set(9,17,18);nose.position.set(0,96,89);head.add(nose);
  for(let s of [-1,1]){let ear=new T.Mesh(new T.SphereGeometry(1,20,12),skin);ear.scale.set(9,20,12);ear.position.set(s*79,100,-7);head.add(ear);}scene.add(head);head.visible=false;
  const remote=new T.Group();remote.name='CLOUD_SYMBOL_NOT_PHYSICAL_PRODUCT';remote.position.set(216,130,-77);
  const rmat=new T.MeshStandardMaterial({color:0x68828b,metalness:.55,roughness:.35});
  for(let i=0;i<3;i++){let r=new T.Mesh(new T.BoxGeometry(54,13,37),rmat);r.position.y=i*19;remote.add(r);let light=new T.Mesh(new T.BoxGeometry(23,2,1),model.mats.blue);light.position.set(-6,i*19,19);remote.add(light);}scene.add(remote);remote.visible=false;
  const future=new T.Group();future.position.set(216,225,-77);let fg=new T.EdgesGeometry(new T.BoxGeometry(65,46,45));let fl=new T.LineSegments(fg,new T.LineDashedMaterial({color:0xe6aa43,dashSize:4,gapSize:3,transparent:true,opacity:.9}));fl.computeLineDistances();future.add(fl);scene.add(future);future.visible=false;
  const flowGroup=new T.Group();scene.add(flowGroup);let flowCurves=[],particles=[],markers=[],step=0,view='assembly',selected='all',explode=.7,animationUntil=0,renderDirty=true;
  const ray=new T.Raycaster(),pointer=new T.Vector2();
  function themeColor(name){let e=document.createElement('span');e.style.color='var('+name+')';host.appendChild(e);let c=getComputedStyle(e).color;e.remove();let c2=document.createElement('canvas').getContext('2d');c2.fillStyle=c;c2.fillRect(0,0,1,1);let d=c2.getImageData(0,0,1,1).data;return new T.Color(d[0]/255,d[1]/255,d[2]/255);}
  let flowColor=themeColor('--viz-series-1'),hypColor=themeColor('--viz-series-2');
  function applyTheme(){flowColor=themeColor('--viz-series-1');hypColor=themeColor('--viz-series-2');grid.material.color.copy(themeColor('--border'));fl.material.color.copy(hypColor);if(view==='flow')buildFlow();renderDirty=true;}
  const stepData=[
    {title:'01 / 电极测量头皮电位差',detail:'接触电极 → 参考电位 → 模拟前端；信号不等同于思想或记忆。',ids:['E01','E02','E03','E04','E05','E06','E07','E08','E09'],labels:[['8 路表面电极',[-65,213,51]],['参考／偏置',[-91,99,-60]]]},
    {title:'02 / 模拟前端与 ADC',detail:'微弱电信号经过调理与模数转换，形成可记录的数字采样。',ids:['H08','H06'],labels:[['AFE / ADC',[0,145,-135]],['屏蔽线束',[-52,210,0]]]},
    {title:'03 / 时间标记、缓存与无线传输',detail:'控制器标记时间并发送数据；头戴电池供电，佩戴时不充电。',ids:['H09','H10'],labels:[['控制与无线',[0,153,-132]],['电池',[-114,133,-22]]]},
    {title:'04 / 接收、加密与本地保存',detail:'底座接收数据，校验并加密，写入可移除存储模块。',ids:['D04','D05'],labels:[['接收／加密',[-44,31,-10]],['本地存储',[66,35,8]]]},
    {title:'05 / 云端数据同步',detail:'云端保存加密记录与模型文件；传输的是数据，没有实现意识转移。',ids:['D05','D06'],labels:[['云端存储（示意）',[216,193,-77]],['本地副本',[65,39,10]]]},
    {title:'? / 意识状态重建：尚无已知实现',detail:'虚线表示科学与技术缺口；空白接口不是意识读取芯片。',ids:['D09'],labels:[['未实现：意识状态重建',[216,267,-77]],['空白研究接口',[65,36,-62]]]}
  ];
  model.parts.forEach(p=>{let opt=document.createElement('option');opt.value=p.userData.id;opt.textContent=p.userData.id+' · '+p.userData.name;partEl.appendChild(opt);});
  function clearFlow(){flowGroup.children.slice().forEach(c=>{flowGroup.remove(c);if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();});particles=[];flowCurves=[];}
  function line(points,dashed=false){let curve=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p)));let geo=new T.BufferGeometry().setFromPoints(curve.getPoints(80));let mat=dashed?new T.LineDashedMaterial({color:hypColor,dashSize:5,gapSize:4}):new T.LineBasicMaterial({color:flowColor,transparent:true,opacity:.7});let l=new T.Line(geo,mat);if(dashed)l.computeLineDistances();flowGroup.add(l);if(!dashed){flowCurves.push(curve);for(let j=0;j<3;j++){let m=new T.Mesh(new T.SphereGeometry(2.5,10,8),new T.MeshBasicMaterial({color:flowColor}));m.userData={curve,phase:j/3};flowGroup.add(m);particles.push(m);}}}
  function buildFlow(){clearFlow();if(view!=='flow')return;
    if(step===0||step===1){model.electrodes.forEach(({p})=>line([p.toArray(),[p.x,211,0],[p.x*.5,172,-105],[0,139,-132]]));}
    else if(step===2)line([[0,150,-132],[90,195,-130],[151,118,-110],[-44,27,-10]]);
    else if(step===3)line([[-44,27,-10],[-8,40,18],[36,40,20],[65,31,6]]);
    else if(step===4)line([[65,31,6],[127,45,0],[177,107,-40],[216,147,-77]]);
    else line([[216,175,-77],[216,196,-77],[216,207,-77]],true);
  }
  function tag(text,pos){let el=document.createElement('span');el.className='c1-tag text-small';el.textContent=text;labelsEl.appendChild(el);markers.push({el,pos:new T.Vector3(...pos)});}
  function updateLabels(){labelsEl.innerHTML='';markers=[];if(view==='flow'){stepData[step].labels.forEach(x=>tag(...x));return;}
    if(selected!=='all'){let g=model.parts.find(x=>x.userData.id===selected),b=new T.Box3().setFromObject(g),p=b.getCenter(new T.Vector3());p.y=b.max.y+12;tag(g.userData.id+' · '+g.userData.name,p.toArray());}
    else if(view==='exploded'){tag('采集头环',[0,300,0]);tag('存储底座',[0,55,135]);}
    else if(view==='wear'){tag('接触式电极',[-67,210,48]);tag('头型示意，不代表适配尺寸',[0,20,75]);}
  }
  function restoreMaterials(){model.root.traverse(o=>{if(!o.isMesh)return;let m=o.material;m.color.setHex(o.userData.baseColor);m.transparent=false;m.opacity=1;m.depthWrite=true;m.emissiveIntensity=o.userData.baseColor===0x25bcca?.3:0;});}
  function paint(){renderDirty=true;restoreMaterials();let active=view==='flow'?stepData[step].ids:(selected==='all'?[]:[selected]);
    model.parts.forEach(g=>{g.traverse(o=>{if(!o.isMesh)return;let m=o.material;if((view==='xray'||view==='flow')&&o.userData.skin){m.transparent=true;m.opacity=.12;m.depthWrite=false;}if(active.includes(g.userData.id)){m.emissive.copy(step===5&&view==='flow'?hypColor:flowColor);m.emissiveIntensity=.22;}});});
  }
  function info(){if(view==='flow'){detailTitle.textContent=stepData[step].title;detailText.textContent=stepData[step].detail;return;}if(selected==='all'){detailTitle.textContent='开放式头环 + 私有存储底座';detailText.textContent='8 路采集电极 · 2 个参考／偏置接触件 · 可拆电池 · 无线数据链路';}else{let d=model.parts.find(x=>x.userData.id===selected).userData;detailTitle.textContent=d.id+' / '+d.name+' / '+d.material;detailText.textContent=d.mechanism+' · '+d.size;}}
  function setView(v,save=true){view=v;viewEl.value=v;head.visible=v==='wear';model.dock.visible=v!=='wear';remote.visible=v==='flow'&&step>=4;future.visible=v==='flow'&&step===5;host.querySelector('#c1-exp-field').hidden=v!=='exploded';host.querySelector('#c1-step-field').hidden=v!=='flow';
    model.parts.forEach(g=>{let e=g.userData.explode;g.position.set(e[0]*(v==='exploded'?explode:0),e[1]*(v==='exploded'?explode:0),e[2]*(v==='exploded'?explode:0));});model.root.updateMatrixWorld(true);
    if(v==='flow'&&step<=2){camera.position.set(390,340,-485);controls.target.set(0,110,-10);}else if(v==='flow'){camera.position.set(400,310,430);controls.target.set(55,115,-20);}else if(v==='exploded'){camera.position.set(420,370,520);controls.target.set(0,135,0);}else{camera.position.set(370,310,455);controls.target.set(0,111,0);}controls.update();
    paint();info();buildFlow();updateLabels();animationUntil=performance.now()+3600;host.querySelector('#c1-size').textContent=v==='flow'?'箭线为信息流示意，非实测信号':v==='wear'?'头型为示意；接触压力与适配尚未设计':'底座名义平面尺寸 240 × 190 mm · 模型单位 mm';if(save)persist();
  }
  function select(id,save=true){selected=id;partEl.value=id;if(view==='flow'&&id!=='all'){setView('xray',save);return;}paint();info();updateLabels();if(save)persist();}
  function persist(){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{device:'CONTINUUM C1',view,part:selected,mechanismStep:step},privateContent:{explode}}).catch(()=>{});}
  function applyState(s){let m=s&&s.modelContent||{},p=s&&s.privateContent||{};if(['assembly','exploded','xray','wear','flow'].includes(m.view))view=m.view;if(model.parts.some(g=>g.userData.id===m.part))selected=m.part;if(Number.isInteger(m.mechanismStep)&&m.mechanismStep>=0&&m.mechanismStep<6)step=m.mechanismStep;if(typeof p.explode==='number')explode=Math.max(0,Math.min(1,p.explode));expEl.value=explode*100;stepEl.value=step;partEl.value=selected;host.querySelector('#c1-exp-val').textContent=Math.round(explode*100)+'%';setView(view,false);}
  viewEl.addEventListener('change',()=>setView(viewEl.value));partEl.addEventListener('change',()=>select(partEl.value));stepEl.addEventListener('change',()=>{step=Number(stepEl.value);setView('flow');});expEl.addEventListener('input',()=>{explode=Number(expEl.value)/100;host.querySelector('#c1-exp-val').textContent=expEl.value+'%';setView('exploded',false);});expEl.addEventListener('change',persist);
  let pointerStart=null;renderer.domElement.addEventListener('pointerdown',e=>pointerStart=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!pointerStart||Math.hypot(e.clientX-pointerStart[0],e.clientY-pointerStart[1])>5)return;let r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);let hits=ray.intersectObjects(model.root.children,true).filter(h=>h.object.visible&&h.object.userData.part);if(hits.length)select(hits[0].object.userData.part);});
  function resize(){let w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.zoom=Math.min(1,camera.aspect/1.3);camera.updateProjectionMatrix();renderDirty=true;}new ResizeObserver(resize).observe(stage);resize();
  function draw(t){let changed=controls.update();let motion=particles.length>0&&t<animationUntil&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(changed||motion||renderDirty){particles.forEach(p=>{let phase=(motion?t/2500:0)+p.userData.phase;p.position.copy(p.userData.curve.getPoint(phase%1));});markers.forEach(m=>{let p=m.pos.clone().project(camera);let x=(p.x*.5+.5)*stage.clientWidth,y=(-p.y*.5+.5)*stage.clientHeight;m.el.style.left=Math.max(m.el.offsetWidth/2+3,Math.min(stage.clientWidth-m.el.offsetWidth/2-3,x))+'px';m.el.style.top=Math.max(15,Math.min(stage.clientHeight-55,y))+'px';m.el.hidden=p.z>1;});renderer.render(scene,camera);renderDirty=false;}requestAnimationFrame(draw);}requestAnimationFrame(draw);
  window.addEventListener('openai:set_globals',e=>{if(e.detail&&e.detail.globals&&e.detail.globals.widgetState)applyState(e.detail.globals.widgetState);});window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
  applyState(window.openai&&window.openai.widgetState);applyTheme();
  window.C1={model,scene,camera,renderer,controls,setView,select,setStep(i){step=i;stepEl.value=i;setView('flow',false);},
    async glb(exploded=false){let old=view;setView(exploded?'exploded':'assembly',false);let exportRoot=model.root.clone(true);exportRoot.scale.setScalar(.001);exportRoot.name='CONTINUUM_C1_METRES';exportRoot.userData={...model.root.userData,units:'metres',sourceUnits:'millimetres',configuration:exploded?'exploded':'assembly'};let result=await new Promise((resolve,reject)=>{new T.GLTFExporter().parse(exportRoot,resolve,{binary:true,onlyVisible:true});});setView(old,false);return Array.from(new Uint8Array(result));},
    stl(id){let g=model.parts.find(x=>x.userData.id===id);let copy=g.clone(true);copy.position.set(0,0,0);copy.updateMatrixWorld(true);return new T.STLExporter().parse(copy,{binary:false});},
    bom(){let current=view;setView('assembly',false);let data=model.parts.map(g=>{let b=new T.Box3().setFromObject(g);return {...g.userData,boundsMm:b.getSize(new T.Vector3()).toArray().map(v=>Math.round(v*10)/10)};});setView(current,false);return data;},
    stats(){let count=0,triangles=0,invalid=[];model.root.traverse(o=>{if(!o.isMesh)return;count++;let a=o.geometry.attributes.position.array;if(Array.from(a).some(v=>!Number.isFinite(v)))invalid.push(o.name);triangles+=(o.geometry.index?o.geometry.index.count:a.length/3)/3;});return {parts:model.parts.length,meshes:count,triangles,invalid,headsetMm:new T.Box3().setFromObject(model.headset).getSize(new T.Vector3()).toArray(),dockMm:new T.Box3().setFromObject(model.dock).getSize(new T.Vector3()).toArray()};}
  };
})();
</script>
